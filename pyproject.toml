[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-vad-plugin-webrtcvad"
dynamic = ["version"]
description = "webrtcvad VAD plugin for OpenVoiceOS"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.9"
keywords = ["vad", "webrtcvad", "ovos", "openvoiceos", "plugin", "voice-activity-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "webrtcvad-wheels",
]

[project.optional-dependencies]
dev = ["pytest<9", "pytest-cov"]
test = [
    "pytest<9",
    "ovoscope>=0.19.0a1,<1.0.0",
    "ovos-dinkum-listener",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-vad-plugin-webrtcvad"
Repository = "https://github.com/OpenVoiceOS/ovos-vad-plugin-webrtcvad"

[project.entry-points."opm.VAD"]
"ovos-vad-plugin-webrtcvad" = "ovos_vad_plugin_webrtcvad:WebRTCVAD"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_vad_plugin_webrtcvad*"]

[tool.setuptools.dynamic]
version = { attr = "ovos_vad_plugin_webrtcvad.version.__version__" }
